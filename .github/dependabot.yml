version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore
      include: scope
    groups:
      typescript:
        patterns:
          - typescript
          - "@typescript-eslint/*"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      changesets:
        patterns:
          - "@changesets/*"
      turbo:
        patterns:
          - turbo
