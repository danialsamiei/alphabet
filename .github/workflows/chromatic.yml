name: Chromatic

# Visual-regression for `@alphabet/ui` Storybook.
# Gated on the `CHROMATIC_PROJECT_TOKEN` repository secret — when the
# secret is absent (e.g. on a fork), every job becomes a no-op so the
# workflow remains green for external contributors.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Check for Chromatic token
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHROMATIC_PROJECT_TOKEN is not set; skipping Chromatic publish."
          fi

  chromatic:
    name: Publish to Chromatic
    needs: preflight
    if: needs.preflight.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required by Chromatic for baseline comparison

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ensure workspace dependencies emit declaration files Storybook can resolve.
      - run: pnpm -F @alphabet/core build || true
      - run: pnpm -F @alphabet/api build || true

      - run: pnpm -F @alphabet/ui build-storybook

      - uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          storybookBuildDir: storybook-static
          exitOnceUploaded: true
          onlyChanged: true
