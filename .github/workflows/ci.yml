name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: install + typecheck + lint + test + build + benchmark + size + openapi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm lint` runs across all packages that declare a lint script.
      # It is allowed to no-op for packages without one (turbo skips them).
      - name: Lint (best-effort)
        run: pnpm lint || echo "lint not configured everywhere — skipping (see docs/RELEASE.md)"

      - name: Test (with coverage where configured)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Benchmark smoke check
        run: pnpm benchmark:smoke

      - name: Bundle size — size-limit
        run: pnpm size

      - name: Bundle size — base @awaf/ui must stay R3F-free
        run: pnpm size:check-r3f-free

      - name: OpenAPI spec validation
        run: pnpm openapi:lint

      - name: Security audit (non-blocking, surfaces high-severity advisories)
        run: pnpm audit --audit-level=high || echo "::warning::pnpm audit found high-severity advisories — review docs/SECURITY.md"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 7
