name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: install + typecheck + lint + test + build + benchmark + size + openapi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.1.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm lint` runs across all packages that declare a lint script.
      # The shared ESLint flat config lives at the workspace root.
      - name: Lint
        run: pnpm lint

      - name: Test (with coverage where configured)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Benchmark smoke check
        run: pnpm benchmark:smoke

      - name: Bundle size — size-limit
        run: pnpm size --json > size-report.json || pnpm size

      - name: Bundle size — base @alphabet/ui must stay R3F-free
        run: pnpm size:check-r3f-free

      - name: Bundle visualizer — per-file raw/gzip/brotli treemap report
        run: pnpm bundle:visualize

      - name: OpenAPI spec validation
        run: pnpm openapi:lint

      - name: Security audit (non-blocking, surfaces high-severity advisories)
        run: pnpm audit --audit-level=high || echo "::warning::pnpm audit found high-severity advisories — review docs/SECURITY.md"

      # Snyk runs only when the repo has SNYK_TOKEN configured. On forks and
      # community PRs without the secret, this step is skipped so CI stays green.
      - name: Snyk — open-source vulnerability scan (optional)
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --all-projects --severity-threshold=high

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bundle size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: size-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload bundle visualizer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-visualizer
          path: bundle-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload built packages (dist tarballs preview)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-dists
          path: |
            packages/*/dist/
          if-no-files-found: ignore
          retention-days: 7
