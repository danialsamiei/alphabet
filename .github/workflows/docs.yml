name: Documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: apps/docs/package.json

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: apps/docs

      - name: Build Docs
        run: pnpm run build
        working-directory: apps/docs
