<?xml version="1.0" encoding="UTF-8"?>
<!--
  Alphabet — animated logo (SVG with CSS keyframes).

  Why an animated SVG instead of a GIF/MP4:
    1. Lossless and scalable to any DPR.
    2. ~3 KB on the wire vs 200+ KB for a comparable GIF.
    3. Honours `prefers-reduced-motion: reduce` natively (the @media block
       below freezes every animation when the visitor opts out — Alphabet's
       core privacy/accessibility principle).
    4. Accessible: <title>/<desc>/role=img all work; screen readers get the
       static description even when motion is disabled.

  Brand palette: navy #1c2432, teal #00d4c8, yellow #ffd93d.
  Render at 512×512 by default; intrinsic aspect is 1:1 so any container size
  works.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512"
     role="img"
     aria-labelledby="alphabet-animated-title alphabet-animated-desc">
  <title id="alphabet-animated-title">Alphabet — animated logo</title>
  <desc id="alphabet-animated-desc">
    A yellow disc with the letter "A" centred on it. A teal ring slowly
    pulses around the disc and five small bars beneath it fade in sequence,
    representing the five Adaptive Render Layers. All motion stops when the
    viewer prefers reduced motion.
  </desc>

  <defs>
    <radialGradient id="discGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%"   stop-color="#fff5b8"/>
      <stop offset="55%"  stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#e8b800"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00d4c8"/>
      <stop offset="100%" stop-color="#0fb1a7"/>
    </linearGradient>
    <style><![CDATA[
      .disc       { transform-origin: 256px 256px; animation: discPulse 4s ease-in-out infinite; }
      .ring-outer { transform-origin: 256px 256px; animation: ringRotate 16s linear infinite,
                                                              ringPulse 4s ease-in-out infinite; }
      .ring-inner { transform-origin: 256px 256px; animation: ringRotate 24s linear infinite reverse; }

      .layer-bar  { animation: layerFade 4s ease-in-out infinite; opacity: 0.25; }
      .layer-bar:nth-child(1) { animation-delay: 0.0s; }
      .layer-bar:nth-child(2) { animation-delay: 0.2s; }
      .layer-bar:nth-child(3) { animation-delay: 0.4s; }
      .layer-bar:nth-child(4) { animation-delay: 0.6s; }
      .layer-bar:nth-child(5) { animation-delay: 0.8s; }

      @keyframes discPulse {
        0%, 100% { transform: scale(1.00); }
        50%      { transform: scale(1.04); }
      }
      @keyframes ringRotate {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ringPulse {
        0%, 100% { stroke-opacity: 0.55; }
        50%      { stroke-opacity: 0.95; }
      }
      @keyframes layerFade {
        0%, 80%, 100% { opacity: 0.25; }
        40%           { opacity: 1.00; }
      }

      /*
       * Privacy/accessibility: when the OS reports reduced motion, the
       * logo is rendered statically. This is the same convention enforced
       * inside the SDK (UI layers 1–3 disable animations under this query).
       */
      @media (prefers-reduced-motion: reduce) {
        .disc, .ring-outer, .ring-inner, .layer-bar {
          animation: none !important;
        }
        .layer-bar { opacity: 0.7; }
      }
    ]]></style>
  </defs>

  <!-- Backdrop (transparent for embedding; uncomment for solid bg) -->
  <!-- <rect width="512" height="512" fill="#1c2432"/> -->

  <!-- Outer + inner rotating rings (the "context" radiating around the glyph) -->
  <g class="ring-outer">
    <circle cx="256" cy="256" r="200"
            fill="none" stroke="url(#ring)" stroke-width="3"
            stroke-dasharray="6 18" stroke-linecap="round"/>
  </g>
  <g class="ring-inner">
    <circle cx="256" cy="256" r="172"
            fill="none" stroke="#00d4c8" stroke-opacity="0.3"
            stroke-width="2" stroke-dasharray="2 14"/>
  </g>

  <!-- Yellow disc + capital A -->
  <g class="disc">
    <circle cx="256" cy="256" r="140" fill="url(#discGlow)"/>
    <text x="256" y="316" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="180" font-weight="900" fill="#1c2432">A</text>
  </g>

  <!-- Five layer bars beneath the disc, fading in sequence -->
  <g transform="translate(176, 416)">
    <rect class="layer-bar" x="0"   y="0" width="28" height="6" rx="3" fill="#00d4c8"/>
    <rect class="layer-bar" x="36"  y="0" width="28" height="6" rx="3" fill="#00d4c8"/>
    <rect class="layer-bar" x="72"  y="0" width="28" height="6" rx="3" fill="#ffd93d"/>
    <rect class="layer-bar" x="108" y="0" width="28" height="6" rx="3" fill="#ffd93d"/>
    <rect class="layer-bar" x="144" y="0" width="28" height="6" rx="3" fill="#f4f6f8"/>
  </g>
</svg>
