<?xml version="1.0" encoding="UTF-8"?>
<!--
  Alphabet — Twitter / X large-image card (1600×900). Same brand palette as
  og-card.svg but with proportions tuned for the X "summary_large_image"
  preview. Typography: system-ui to avoid bundling a font.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     width="1600" height="900"
     role="img"
     aria-label="Alphabet — The Alphabet of Your Web. A privacy-first, context-aware, adaptive web SDK.">
  <title>Alphabet — The Alphabet of Your Web</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2432"/>
      <stop offset="100%" stop-color="#0a0f17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4c8"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.65">
      <stop offset="0%" stop-color="#00d4c8" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#00d4c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Large faint glyph in the background -->
  <text x="1100" y="720"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="640" font-weight="900"
        fill="#ffd93d" fill-opacity="0.05" text-anchor="middle">A</text>

  <!-- Header -->
  <g transform="translate(120, 120)">
    <circle cx="28" cy="28" r="28" fill="#ffd93d"/>
    <text x="28" y="40" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="32" font-weight="800" fill="#1c2432">A</text>
    <text x="76" y="36" font-family="system-ui, sans-serif"
          font-size="28" font-weight="600" fill="#f4f6f8">alphabet</text>
    <text x="76" y="62" font-family="system-ui, sans-serif"
          font-size="15" font-weight="400" fill="#9aa3b2">v1.0 · danial.ai Edition · Alefba International AI Research</text>
  </g>

  <!-- Hero -->
  <g transform="translate(120, 320)">
    <text font-family="system-ui, sans-serif" font-size="92" font-weight="800" fill="#f4f6f8">
      <tspan x="0" dy="0">The Alphabet of</tspan>
      <tspan x="0" dy="100">Your Web.</tspan>
    </text>
    <text x="0" y="244"
          font-family="system-ui, sans-serif" font-size="32" font-weight="500" fill="#9aa3b2">
      A privacy-first, context-aware, adaptive web SDK.
    </text>
    <text x="0" y="290"
          font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="#9aa3b2">
      Five Adaptive Render Layers. Four monotonic consent tiers.
    </text>
    <text x="0" y="324"
          font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="#9aa3b2">
      Zero cookies. Zero fingerprinting. Zero third-party calls.
    </text>
  </g>

  <!-- Accent bar -->
  <rect x="120" y="780" width="320" height="8" rx="4" fill="url(#accent)"/>

  <!-- Footer -->
  <g transform="translate(120, 830)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" font-weight="500" fill="#9aa3b2">
      alphabet.alef.ba · github.com/danialsamiei/alphabet · MIT
    </text>
  </g>
</svg>
