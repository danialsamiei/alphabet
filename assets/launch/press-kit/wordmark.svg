<?xml version="1.0" encoding="UTF-8"?>
<!--
  Alphabet — horizontal wordmark (logo + name + tagline).
  Designed for headers, README badges, and press kits where vertical space
  is limited. Use at any height ≥ 32 px; intrinsic aspect 4:1.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 200"
     width="800" height="200"
     role="img"
     aria-label="Alphabet — The Alphabet of Your Web">
  <title>Alphabet wordmark</title>
  <defs>
    <linearGradient id="wm-disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff5b8"/>
      <stop offset="55%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#e8b800"/>
    </linearGradient>
    <linearGradient id="wm-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4c8"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
  </defs>

  <!-- Disc + A -->
  <g transform="translate(40, 40)">
    <circle cx="60" cy="60" r="60" fill="url(#wm-disc)"/>
    <text x="60" y="92" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="80" font-weight="900" fill="#1c2432">A</text>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(180, 50)">
    <text font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="#1c2432">alphabet</text>
    <text x="0" y="48" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#4a5568">
      The Alphabet of Your Web
    </text>
    <rect x="0" y="68" width="120" height="4" rx="2" fill="url(#wm-accent)"/>
  </g>
</svg>
